<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Geolocation & Feed 30 Hari</title>
    <!-- CSS Leaflet untuk Peta -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR / HEADER -->
    <header>
        <h1>GeoFeed App</h1>
        <div class="nav-right">
            <button id="btn-login" onclick="loginGoogle()">Login Google</button>
            <div id="user-profile" style="display: none;">
                <span id="user-name"></span>
                <button onclick="logoutGoogle()">Logout</button>
            </div>
        </div>
    </header>

    <!-- NAVIGASI MENU -->
    <nav class="sub-nav">
        <button class="tab-btn active" onclick="switchTab('home')">Home (Feed)</button>
        <button class="tab-btn" onclick="checkLocationAccess()">Lokasi Terkini</button>
    </nav>

    <!-- HALAMAN 1: HOME / FEED -->
    <main id="page-home" class="page active">
        <section class="feed-container" id="feed-list">
            <!-- Feed postingan akan muncul di sini -->
        </section>

        <!-- BUBBLE KAMERA (FLOATING BUTTON) -->
        <div class="camera-bubble" onclick="openUploadModal()">
            📷
        </div>
    </main>

    <!-- HALAMAN 2: LOKASI TERKINI (REAL-TIME) -->
    <main id="page-location" class="page">
        <h2>Live Geolocation Anda</h2>
        <p>Halaman ini memerlukan akses GPS aktif secara real-time.</p>
        <div id="map" style="width: 100%; height: 400px; border-radius: 8px; margin-top: 15px;"></div>
        <div id="coord-info" style="margin-top: 10px; font-weight: bold;"></div>
    </main>

    <!-- MODAL UPLOAD FOTO/VIDEO -->
    <div id="upload-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" onclick="closeUploadModal()">&times;</span>
            <h3>Buat Postingan Baru</h3>
            <input type="file" id="media-file" accept="image/*,video/*"><br><br>
            <textarea id="media-caption" placeholder="Tulis caption/deskripsi..."></textarea><br><br>
            <button onclick="submitPost()">Posting</button>
        </div>
    </div>

    <!-- Script Leaflet & Firebase -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
